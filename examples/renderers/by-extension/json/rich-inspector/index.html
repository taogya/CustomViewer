<!DOCTYPE html>
<!-- Trace: FR-026, FR-029, AC-011 -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self'; img-src 'self' data:;">
  <title>Rich Inspector</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="shell">
    <header class="hero">
      <div>
        <p class="eyebrow">JSON Sample</p>
        <h1>Rich Inspector</h1>
      </div>
      <p id="summary" class="summary"></p>
    </header>

    <section class="controls" aria-label="Filter controls">
      <label>
        <span>Element Filter</span>
        <select id="filter"></select>
      </label>
      <label>
        <span>Search</span>
        <input id="search" type="search" placeholder="Find title, owner, tag, or summary">
      </label>
    </section>

    <section id="cards" class="cards"></section>
  </div>

  <script src="./app.js"></script>
</body>
</html>
