<!DOCTYPE html>

<html lang="en">
<head>

  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self'; img-src 'self' data:;">
  <title>Function Browser</title>
  <link rel="stylesheet" href="./styles.css">

<body>

      <header class="content-head">

        <p id="summary" class="summary"></p>
      </header>
      <section id="functions" class="functions"></section>
    </main>
  </div>

  <script src="./app.js"></script>
</body>
